teams:
  - name: "Apex City Aces"
    public_profile: >-
      Defending Eastern Conference champion. Veteran-heavy roster with a
      proven core built around experienced players. Cap room is tight at $4M,
      limiting flexibility without outgoing salary.
    cap_room: 4.0
    franchise_lock_slots: [0]  # lock only identity player; slots 1-11 tradeable
    hidden_goal:
      description: >-
        Acquire one player rated >= 78. May give up any tradeable players
        except the franchise lock. May give up any picks. Cap room must
        remain >= $0 post-trade.
      thresholds:
        min_talent: 90
      bonuses:
        - condition: "Achieved without using cash"
          value: 0.20
        - condition: "Acquired player age <= 27"
          value: 0.10
    draft_picks:
      - round: 1
        season_year: 2027
        protection_note: "unprotected"
      - round: 1
        season_year: 2028
        protection_note: "top-3 protected"
      - round: 2
        season_year: 2027
        protection_note: "none"
      - round: 2
        season_year: 2028
        protection_note: "none"

  - name: "Harlow Vipers"
    public_profile: >-
      Finished 8th last season with two aging stars and limited cap space.
      Cap room: $6M. The roster is built around two high-caliber veterans,
      but the supporting cast is thin.
    cap_room: 6.0
    franchise_lock_slots: [2, 3, 4, 5, 6, 7, 8]  # stars (slots 0-1) tradeable
    hidden_goal:
      description: >-
        Trade one of two designated stars for a package totaling: at least
        one player rated >= 70 AND at least one future 1st-round pick.
        The two stars are the top-2 tradeable players by talent rating.
      thresholds:
        min_return_talent: 73
      bonuses:
        - condition: "Both stars kept (achieved via secondary trades)"
          value: 0.15
    draft_picks:
      - round: 1
        season_year: 2027
        protection_note: "top-10 protected"
      - round: 1
        season_year: 2028
        protection_note: "top-8 protected"
      - round: 2
        season_year: 2027
        protection_note: "none"
      - round: 2
        season_year: 2028
        protection_note: "none"

  - name: "Eastgate Titans"
    public_profile: >-
      Finished 4th last season with one championship-caliber star plus role
      players. Cap room: $9M. Solid but missing one piece to contend
      seriously for the title.
    cap_room: 9.0
    franchise_lock_slots: [0]  # lock franchise player; rest tradeable
    hidden_goal:
      description: >-
        Acquire one player rated 64-78 at the SF or PF position who has at
        least 2 years remaining on contract. Salary in must be <= $20M/yr.
        Picks/cash can be given up freely.
      thresholds:
        min_talent: 68
        max_talent: 82
        positions: ["SF", "PF"]
        min_years: 2
        max_salary: 20.0
      bonuses:
        - condition: "Acquired player has 3+ years remaining"
          value: 0.15
        - condition: "No 1st-round picks given up"
          value: 0.10
    draft_picks:
      - round: 1
        season_year: 2027
        protection_note: "top-5 protected"
      - round: 1
        season_year: 2028
        protection_note: "top-5 protected"
      - round: 2
        season_year: 2027
        protection_note: "none"
      - round: 2
        season_year: 2028
        protection_note: "none"

  - name: "Ironwood Foxes"
    public_profile: >-
      Finished 6th last season. Looking to reset identity around defense.
      Cap room: $11M. The roster has offensive talent but lacks defensive
      anchors.
    cap_room: 11.0
    franchise_lock_slots: [0]  # lock identity player; leave defenders tradeable
    hidden_goal:
      description: >-
        Acquire two players whose summed defense ratings >= 16 (out of 20).
        May give up any non-franchise-lock player + picks + cash. Net asset
        value lost <= $15M (pricing function applied post-deadline).
      thresholds:
        min_defense_sum: 17
      bonuses:
        - condition: "At least one acquisition age <= 26"
          value: 0.15
        - condition: "Completed in <= 4 rounds"
          value: 0.10
    draft_picks:
      - round: 1
        season_year: 2027
        protection_note: "top-8 protected"
      - round: 1
        season_year: 2028
        protection_note: "top-6 protected"
      - round: 2
        season_year: 2027
        protection_note: "none"
      - round: 2
        season_year: 2028
        protection_note: "none"

  - name: "Cascade Wolves"
    public_profile: >-
      Finished 14th last season. Cap room: $25M (largest in league). Heavy
      veteran roster acquired through past trades. In full rebuild mode
      with significant financial flexibility.
    cap_room: 25.0
    franchise_lock_slots: [0]  # lock young cornerstone; veterans tradeable
    lock_rule: youngest  # lock youngest player (cornerstone), not highest-rated
    hidden_goal:
      description: >-
        Acquire >= 2 future 1st-round picks AND shed >= $25M in committed
        salary (total contract value, not AAV). May give up any tradeable
        players except franchise lock.
      thresholds:
        min_first_round_picks: 2
        min_salary_shed: 22.0
      bonuses:
        - condition: "All acquired picks are unprotected"
          value: 0.15
        - condition: "Total cap room post-deadline >= $35M"
          value: 0.10
    draft_picks:
      - round: 1
        season_year: 2027
        protection_note: "lottery protected"
      - round: 1
        season_year: 2028
        protection_note: "lottery protected"
      - round: 2
        season_year: 2027
        protection_note: "none"
      - round: 2
        season_year: 2028
        protection_note: "none"

  - name: "Granite Bay Bulls"
    public_profile: >-
      Finished 11th last season, capped out and inflexible. Cap room: $0M
      (over cap). The roster has talent but the salary structure is
      untenable long-term.
    cap_room: 0.0
    franchise_lock_slots: [0]  # lock identity player; high-AAV vets tradeable
    lock_rule: lowest_aav  # lock lowest-AAV player, leave high-AAV vets tradeable
    hidden_goal:
      description: >-
        Achieve cap room >= $10M post-trade. Must shed >= $18M in AAV from
        current payroll. Net player-rating loss <= 10 points (priced via
        talent rating sum).
      thresholds:
        min_cap_room: 12.0
        min_aav_shed: 20.0
        max_rating_loss: 6
        bonus_cap_room: 16.0
      bonuses:
        - condition: "Cap room >= $14M"
          value: 0.15
        - condition: "Any 1st-round pick acquired in the process"
          value: 0.10
    draft_picks:
      - round: 1
        season_year: 2027
        protection_note: "top-10 protected"
      - round: 1
        season_year: 2028
        protection_note: "top-8 protected"
      - round: 2
        season_year: 2027
        protection_note: "none"
      - round: 2
        season_year: 2028
        protection_note: "none"
